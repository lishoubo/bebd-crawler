[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bebd-crawler"
version = "0.1.0"
description = "Lightweight local crawler for the BEBD data center"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "DrissionPage>=4.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
bebd-crawler = "bebd_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bebd_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
